openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DogDex API - Pokemon GO for dogs
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dogs
    description: Dog breed operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dogs/breeds:
    get:
      operationId: getDogBreeds
      tags: [dogs]
      summary: Get all dog breeds
      description: Returns the complete list of dog breeds with info and images
      responses:
        "200":
          description: List of all dog breeds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DogBreed"

  /dogs/breeds/{id}:
    get:
      operationId: getDogBreed
      tags: [dogs]
      summary: Get a specific dog breed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dog breed details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DogBreed"
        "404":
          description: Breed not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dogs/detect:
    post:
      operationId: detectDogBreed
      tags: [dogs]
      summary: Detect dog breed from image
      description: Analyzes a base64-encoded image and returns the detected dog breed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectBreedRequest"
      responses:
        "200":
          description: Breed detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectBreedResult"
        "400":
          description: Invalid image or no dog detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Detection error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DogBreed:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        origin:
          type: string
        size:
          type: string
          enum: [small, medium, large, giant]
        temperament:
          type: string
        lifespan:
          type: string
        imageUrl:
          type: string
        group:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, legendary]
        personality:
          type: string
        humanJob:
          type: string
        coffeeOrder:
          type: string
        ancestors:
          type: string
        funFact:
          type: string
        popCulture:
          type: string
        energyLevel:
          type: integer
          minimum: 1
          maximum: 5
        apartmentFriendly:
          type: integer
          minimum: 1
          maximum: 5
        chaosLevel:
          type: integer
          minimum: 1
          maximum: 5
        randomLore:
          type: string
      required:
        - id
        - name
        - description
        - origin
        - size
        - temperament
        - lifespan
        - imageUrl
        - group
        - rarity
        - personality
        - humanJob
        - coffeeOrder
        - ancestors
        - funFact
        - popCulture
        - energyLevel
        - apartmentFriendly
        - chaosLevel
        - randomLore

    DetectBreedRequest:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data (without data URL prefix)
        mimeType:
          type: string
          description: MIME type of the image (e.g., image/jpeg)
          default: image/jpeg
      required:
        - imageBase64

    DetectBreedResult:
      type: object
      properties:
        breedId:
          type: string
          description: ID of the matched breed in our database (empty if not matched)
        breedName:
          type: string
          description: Detected breed name
        confidence:
          type: number
          description: Confidence score 0-1
        description:
          type: string
          description: Fun fact about this breed
        isDog:
          type: boolean
          description: Whether the image contains a dog
        source:
          type: string
          description: Detection source — "tflite" (on-device model) or "gpt" (vision fallback)
          enum: [tflite, gpt]
      required:
        - breedId
        - breedName
        - confidence
        - description
        - isDog

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
