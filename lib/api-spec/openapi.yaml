openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DogDex API - Pokemon GO for dogs
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dogs
    description: Dog breed operations
  - name: users
    description: User profile and leaderboard
  - name: leaderboard
    description: Rankings by collection
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dogs/breeds:
    get:
      operationId: getDogBreeds
      tags: [dogs]
      summary: Get all dog breeds
      description: Returns the complete list of dog breeds with info and images
      responses:
        "200":
          description: List of all dog breeds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DogBreed"

  /dogs/breeds/{id}:
    get:
      operationId: getDogBreed
      tags: [dogs]
      summary: Get a specific dog breed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dog breed details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DogBreed"
        "404":
          description: Breed not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dogs/detect:
    post:
      operationId: detectDogBreed
      tags: [dogs]
      summary: Detect dog breed from image
      description: Analyzes a base64-encoded image and returns the detected dog breed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectBreedRequest"
      responses:
        "200":
          description: Breed detection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectBreedResult"
        "400":
          description: Invalid image or no dog detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Detection error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me:
    get:
      operationId: getMyProfile
      tags: [users]
      summary: Get current user's stored profile
      description: Returns the authenticated user's profile from the database
      responses:
        "200":
          description: User profile (null if not yet synced)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/sync:
    post:
      operationId: syncUser
      tags: [users]
      summary: Sync user profile after registration
      description: Creates or updates the user's profile with country and username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncUserRequest"
      responses:
        "200":
          description: User synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/collect:
    post:
      operationId: recordCollection
      tags: [users]
      summary: Record a new dog collection
      description: Increments the user's collection count and XP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectRequest"
      responses:
        "200":
          description: Collection recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get ranked users
      description: Returns leaderboard rankings. Filter by country or get global rankings.
      parameters:
        - name: country
          in: query
          schema:
            type: string
          description: Filter to a specific country (e.g. "United States")
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
          description: Max results to return
      responses:
        "200":
          description: Leaderboard rankings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"
        "500":
          description: Database error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DogBreed:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        origin:
          type: string
        size:
          type: string
          enum: [small, medium, large, giant]
        temperament:
          type: string
        lifespan:
          type: string
        imageUrl:
          type: string
        group:
          type: string
        rarity:
          type: string
          enum: [common, uncommon, rare, legendary]
        personality:
          type: string
        humanJob:
          type: string
        coffeeOrder:
          type: string
        ancestors:
          type: string
        funFact:
          type: string
        popCulture:
          type: string
        energyLevel:
          type: integer
          minimum: 1
          maximum: 5
        apartmentFriendly:
          type: integer
          minimum: 1
          maximum: 5
        chaosLevel:
          type: integer
          minimum: 1
          maximum: 5
        randomLore:
          type: string
      required:
        - id
        - name
        - description
        - origin
        - size
        - temperament
        - lifespan
        - imageUrl
        - group
        - rarity
        - personality
        - humanJob
        - coffeeOrder
        - ancestors
        - funFact
        - popCulture
        - energyLevel
        - apartmentFriendly
        - chaosLevel
        - randomLore

    DetectBreedRequest:
      type: object
      properties:
        imageBase64:
          type: string
          description: Base64-encoded image data (without data URL prefix)
        mimeType:
          type: string
          description: MIME type of the image (e.g., image/jpeg)
          default: image/jpeg
      required:
        - imageBase64

    DetectBreedResult:
      type: object
      properties:
        breedId:
          type: string
          description: ID of the matched breed in our database (empty if not matched)
        breedName:
          type: string
          description: Detected breed name
        confidence:
          type: number
          description: Confidence score 0-1
        description:
          type: string
          description: Fun fact about this breed
        isDog:
          type: boolean
          description: Whether the image contains a dog
        source:
          type: string
          description: Detection source — "tflite" (on-device model) or "gpt" (vision fallback)
          enum: [tflite, gpt]
      required:
        - breedId
        - breedName
        - confidence
        - description
        - isDog

    MyProfile:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
          nullable: true
        country:
          type: string
        countryFlag:
          type: string
        collectionCount:
          type: integer
        xp:
          type: integer
        avatarUrl:
          type: string
          nullable: true
      required:
        - username
        - country
        - countryFlag
        - collectionCount
        - xp

    SyncUserRequest:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
        displayName:
          type: string
          maxLength: 100
        country:
          type: string
          maxLength: 100
        countryFlag:
          type: string
          maxLength: 10
        avatarUrl:
          type: string
          format: uri
      required:
        - username
        - country

    CollectRequest:
      type: object
      properties:
        xpDelta:
          type: integer
          default: 10
          minimum: 0
          maximum: 1000

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean

    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        clerkId:
          type: string
        username:
          type: string
        displayName:
          type: string
          nullable: true
        country:
          type: string
        countryFlag:
          type: string
        collectionCount:
          type: integer
        xp:
          type: integer
        avatarUrl:
          type: string
          nullable: true
      required:
        - rank
        - clerkId
        - username
        - country
        - countryFlag
        - collectionCount
        - xp

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message
