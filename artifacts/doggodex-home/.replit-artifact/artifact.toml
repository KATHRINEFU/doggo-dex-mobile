kind = "web"
previewPath = "/"
title = "Doggo Dex Homepage"
description = "A public Doggo Dex website for dog lovers, introducing breed scanning, collectible progress, and a privacy policy."
version = "1.0.0"
id = "artifacts/doggodex-home"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21764

[services.development]
run = "pnpm --filter @workspace/doggodex-home run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/doggodex-home", "run", "build" ]
serve = "static"
publicDir = "artifacts/doggodex-home/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21764"
BASE_PATH = "/"
